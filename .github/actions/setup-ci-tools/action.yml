name: Set up Node.js and pnpm
description: Verify the Node.js release archive and install the project-pinned pnpm through Corepack.
runs:
  using: composite
  steps:
    - name: Install verified Node.js and pnpm
      shell: bash
      run: |
        node_version=24.22.3
        # Digests from the signed Node.js release checksum manifest.
        case "$(uname -s)-$(uname -m)" in
          Darwin-arm64)
            platform=darwin-arm64
            digest=ff6e17d4874b76d272212b908cc020d6e815fba5a6c7eaaa06add725840307fd
            ;;
          Darwin-x86_64)
            platform=darwin-x64
            digest=977614af0504c81045e7fd85596dbca0e5f951b96681516dadafedcca8c447f7
            ;;
          Linux-x86_64)
            platform=linux-x64
            digest=061ec3e3062115705b56b51fa9cc330ab50d34b6969387d4e4b1a50c6809acc2
            ;;
          *)
            echo "Unsupported Node.js runner platform" >&2
            exit 1
            ;;
        esac
        node_dir=$(mktemp -d "$RUNNER_TEMP/node.XXXXXX")
        archive="$node_dir/node.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          "https://nodejs.org/dist/v$node_version/node-v$node_version-$platform.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$node_dir" --strip-components=1
        rm "$archive"

        export PATH="$node_dir/bin:$PATH"
        corepack enable pnpm
        corepack install
        echo "$node_dir/bin" >> "$GITHUB_PATH"
