name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            command: pnpm run format:check
          - name: Lint
            command: pnpm run lint
          - name: Typecheck
            command: pnpm run typecheck
          - name: Tests
            command: pnpm test
          - name: Build
            command: pnpm release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up verified Node.js and pnpm
        run: bash .github/scripts/setup-toolchain.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
